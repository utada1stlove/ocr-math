# 慢速档：真的编 LaTeX，抓版面回归（Overfull / Missing character / 页数漂移）。
#
# 为什么不全天跑：texlive-xetex + texlive-lang-chinese 装一次约 1-2GB，
# 跑一轮十分钟量级，挡在每次 push 上性价比太低。所以只在夜间和手动触发。
#
# 想立刻验证：本地 `python scripts/gate.py slow`（需 TeX Live 在 PATH）。
name: latex

on:
  schedule:
    # 每天 18:00 UTC = 次日 02:00 Asia/Shanghai，避开使用高峰
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0" "Jinja2>=3.1"

      - name: 安装 TeX Live（xelatex + ctex + latexmk）
        run: |
          sudo apt-get update
          # texlive-pictures 单独装：tcolorbox 的 skins 库要 pgf/tikz，
          # 而 Debian 的 texlive-latex-extra 不依赖它（包粒度粗，容易漏）
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-pictures
          # 字体：ctex 默认会找这些，缺了就是满屏 Missing character
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -fv
          latexmk -v | head -3
          xelatex --version | head -2

      - name: 五套模板编译 + 日志机检
        run: python scripts/ci_latex_gate.py

      - name: pack --strict + 页数核对
        run: python scripts/ci_pack_check.py

      - name: 失败时上传 LaTeX 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs-${{ github.run_id }}
          path: out/.build/**/main.log
          if-no-files-found: ignore

      - name: 汇总（本地同一条命令）
        if: always()
        run: echo "本地复现：python scripts/gate.py slow"

