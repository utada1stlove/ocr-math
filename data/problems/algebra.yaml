# 示例题库：函数与导数、三角、数列、解析几何、概率
# 字段说明见 README；statement/solution 里写 LaTeX 片段（正文 + 行内公式），不要写 \documentclass。
problems:
  - id: fx-001
    title: 二次函数单调性
    statement: 已知函数 $f(x)=x^{2}-2ax+3$ 在区间 $[1,2]$ 上单调递增，求实数 $a$ 的取值范围。
    answer: $a \le 1$
    solution: 由 $f'(x)=2x-2a \ge 0$ 在 $[1,2]$ 上恒成立，得 $a \le x$ 对任意 $x \in [1,2]$ 成立，故 $a \le 1$。
    steps:
      - '求导：$f''(x)=2x-2a$。'
      - '单调递增要求 $f''(x)\ge 0$ 在 $[1,2]$ 上恒成立，即 $a\le x$ 对一切 $x\in[1,2]$ 成立。'
      - '右端的最小值是 $1$（在 $x=1$ 处取到），因此 $a\le 1$。'
      - '当 $a=1$ 时 $f''(x)=2x-2\ge 0$ 在 $[1,2]$ 上成立，端点可取，故范围是 $a\le 1$。'
    pitfalls:
      - '把「单调递增」直接当成 $f''(x)>0$，漏掉 $a=1$ 这个端点。'
      - '只代入 $x=1$ 求 $a$，没有说明对区间内所有 $x$ 都成立。'
    hint: '单调递增的充要条件是导数在区间上非负，把参数分离出来更直观。'
    teaching: '讲评时强调「恒成立」与「存在」的区别，并让学生验证端点 $a=1$ 是否可取。'
    tags: [函数性质, 导数应用]
    difficulty: 2
    workspace_mm: 35

  - id: fx-002
    title: 三次函数极值
    statement: 函数 $f(x)=x^{3}-3x$ 的极大值点是（　　）
    choices:
      - $x=-1$
      - $x=1$
      - $x=-\sqrt{3}$
      - $x=\sqrt{3}$
    answer: A
    solution: $f'(x)=3x^{2}-3=3(x-1)(x+1)$。当 $x<-1$ 时 $f'(x)>0$，当 $-1<x<1$ 时 $f'(x)<0$，故 $x=-1$ 为极大值点。
    steps:
      - '求导：$f''(x)=3x^{2}-3=3(x-1)(x+1)$。'
      - '令 $f''(x)=0$ 得 $x=\pm 1$，列表判断符号：$x<-1$ 时导数为正，$-1<x<1$ 时为负，$x>1$ 时为正。'
      - '导数由正变负处取极大值，故 $x=-1$ 是极大值点。'
    pitfalls:
      - '把「极大值点」与「极大值」混淆，答案写成 $f(-1)=2$。'
      - '只凭图像记忆判断符号，没有列表验证导数在驻点两侧的变化。'
    hint: '先求导、再令导数为零、最后看导数符号的变化方向。'
    teaching: '可补充「$x=-1$ 处导数为零但两侧符号由正变负」的表格，帮助学生建立一般流程。'
    tags: [导数应用]
    difficulty: 3
    workspace_mm: 0

  - id: fx-003
    statement: 计算 $\log_{2}8+\left(\dfrac{1}{2}\right)^{-2}-\sqrt[3]{27}$ 的值。
    answer: $4$
    solution: $\log_{2}8=3$，$\left(\dfrac{1}{2}\right)^{-2}=4$，$\sqrt[3]{27}=3$，故原式 $=3+4-3=4$。
    tags: [指数对数]
    difficulty: 2
    workspace_mm: 30

  - id: tri-001
    statement: 在 $\triangle ABC$ 中，$a=3$，$b=4$，$C=\dfrac{\pi}{3}$，求边 $c$ 的长。
    answer: $\sqrt{13}$
    solution: 由余弦定理 $c^{2}=a^{2}+b^{2}-2ab\cos C=9+16-12=13$，故 $c=\sqrt{13}$。
    tags: [解三角形]
    difficulty: 2
    workspace_mm: 30

  - id: seq-001
    statement: 等差数列 $\{a_{n}\}$ 中，$a_{3}=7$，$a_{7}=15$，求 $a_{10}$ 及前 $10$ 项和 $S_{10}$。
    answer: $a_{10}=21$，$S_{10}=120$
    solution: 公差 $d=\dfrac{15-7}{7-3}=2$，首项 $a_{1}=a_{3}-2d=3$，故 $a_{10}=a_{1}+9d=21$，$S_{10}=\dfrac{10(a_{1}+a_{10})}{2}=120$。
    steps:
      - '由 $a_{7}-a_{3}=4d$ 得 $d=\dfrac{15-7}{7-3}=2$。'
      - '由 $a_{3}=a_{1}+2d$ 得 $a_{1}=7-4=3$。'
      - '$a_{10}=a_{1}+9d=3+18=21$。'
      - '$S_{10}=\dfrac{10(a_{1}+a_{10})}{2}=5\times 24=120$。'
    pitfalls:
      - '公差与项数混淆：$a_{7}-a_{3}=4d$，不是 $d=15-7$。'
      - '求 $S_{10}$ 时漏掉除以 $2$，或把项数写成 $9$。'
    hint: '先用两项之差求公差，再回代求首项。'
    teaching: '让学生自己写出 $a_{n}=a_{1}+(n-1)d$ 再代入，避免公式记混。'
    tags: [等差等比]
    difficulty: 2
    workspace_mm: 35

  - id: geo-001
    title: 椭圆的离心率
    statement: 椭圆 $\dfrac{x^{2}}{4}+\dfrac{y^{2}}{3}=1$ 的离心率为（　　）
    choices:
      - $\frac{1}{2}$
      - $\frac{\sqrt{3}}{2}$
      - $\frac{\sqrt{7}}{4}$
      - $\frac{3}{4}$
    answer: A
    solution: $a=2$，$b=\sqrt{3}$，$c=\sqrt{a^{2}-b^{2}}=1$，故 $e=\dfrac{c}{a}=\dfrac{1}{2}$。
    tags: [圆锥曲线]
    difficulty: 2
    workspace_mm: 20

  - id: prob-001
    statement: 从 $1,2,3,4,5$ 中任取两个不同的数字，求两数之和为偶数的概率。
    answer: $\dfrac{2}{5}$
    solution: 总取法 $\binom{5}{2}=10$ 种；两数和为偶数需同奇偶：奇数 $1,3,5$ 中取两个有 $3$ 种，偶数只取 $2,4$ 有 $1$ 种，共 $4$ 种，故概率为 $\dfrac{4}{10}=\dfrac{2}{5}$。
    steps:
      - '从 $5$ 个数中任取两个，总取法为 $\binom{5}{2}=10$。'
      - '两数之和为偶数当且仅当两数同奇偶。'
      - '奇数 $1,3,5$ 中取两个有 $\binom{3}{2}=3$ 种；偶数只有 $2,4$，取两个有 $1$ 种。'
      - '有利取法共 $4$ 种，概率 $P=\dfrac{4}{10}=\dfrac{2}{5}$。'
    pitfalls:
      - '把「任取两个」当成有放回抽取，分母写成 $25$。'
      - '把「和为偶数」误判为一个奇数一个偶数。'
    hint: '先分类：同奇或同偶，再用组合数计数。'
    teaching: '强调「不放回」与「组合」的对应关系，并让学生用枚举验证 $10$ 种取法。'
    tags: [概率]
    difficulty: 2
    workspace_mm: 30
